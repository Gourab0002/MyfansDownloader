<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyFans Downloader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1916'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' fill='%23fbf8f3' font-family='Georgia'%3EMf%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="{% block page %}download{% endblock %}">
    <div class="app">
        <header class="top">
            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-mark">Mf</span>
                <span>
                    <strong>MyFans</strong>
                    <em>Downloader</em>
                </span>
            </a>
            <nav>
                <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Download</a>
                <a href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}aria-current="page"{% endif %}>Settings</a>
            </nav>
            <div class="top-actions">
                <a class="pill" id="tokenPill" href="{{ url_for('settings') }}">Checking token</a>
                <button type="button" class="ghost" id="openFolder">Open folder</button>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
